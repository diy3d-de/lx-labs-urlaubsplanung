# Baut Desktop-App (Windows-Installer) und Mobile-App (Android-APK) mit automatischen Updates.
# - Tag v* (git tag vX.Y.Z && git push origin main vX.Y.Z): Builds, Tests, Paketprüfung und GENAU EIN
#   Release-Entwurf mit Installer, .blockmap, latest.yml, APK und APK-Prüfsumme. Installierte Apps sehen
#   das Update erst, wenn der Entwurf veröffentlicht ist (gh release edit vX.Y.Z --draft=false --latest …).
# - manuell (workflow_dispatch): Probe-Build ohne Veröffentlichung; APK dann nur debug-signiert.
#
# Härtung: Die Builds laufen nur mit Leserechten und ohne gespeicherte Zugangsdaten; Schreibrechte bekommt
# allein der kleine Release-Job, der keinen Projektcode ausführt.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Nicht windows-latest: Runner mit neuerem Visual Studio erkennt node-gyp älterer electron-builder nicht.
    runs-on: windows-2022
    env:
      # Ohne Zertifikat keine Signatur versuchen
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # Actions per Commit-SHA gepinnt: ein verschobener Tag kann keinen fremden Code einschleusen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Release-Builds ohne Cache (kein Risiko durch einen manipulierten Cache)
          cache: ${{ github.event_name == 'push' && '' || 'npm' }}
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Tag muss zur Version in package.json passen
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu package.json ($VERSION)"
            exit 1
          fi

      # Ohne Lifecycle-Skripte der Abhängigkeiten; better-sqlite3 bringt Node-API-Prebuilds mit.
      - name: Abhängigkeiten installieren
        run: |
          npm ci --ignore-scripts
          npm run desktop:deps
          npx prisma generate

      - name: Typprüfung, Lint und Tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Desktop-App bauen
        run: |
          npm run desktop:prepare
          npx electron-builder --win --publish never

      # Jede Abhängigkeit muss im Paket so auflösbar sein wie später zur Laufzeit.
      - name: Paket prüfen
        run: node scripts/pruefe-paket.cjs

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lx-urlaubsplanung-windows
          path: |
            dist/lx-urlaubsplanung-Setup-*.exe
            dist/lx-urlaubsplanung-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7

      # Versionsname aus package.json, versionCode = Major*10000 + Minor*100 + Patch (muss stetig steigen)
      - name: Version bestimmen
        id: version
        run: |
          VERSION="$(node -p "require('../package.json').version")"
          IFS=. read -r MA MI PA <<< "$VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"

      - name: Analyse und Tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # Updates installiert Android nur mit demselben Schlüssel - ein Release ohne Schlüssel wäre wertlos.
      - name: Release-Schlüssel einrichten
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Android-Signatur-Secrets fehlen (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)"
            exit 1
          fi
          # Whitespace/Zeilenenden entfernen (je nach Hochladeweg hängt am Secret ein CR/LF), sonst bricht base64 -d ab
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload.jks
          test -s android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: APK bauen
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "$CODE"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/lx-urlaubsplanung-$VERSION.apk"
          cd ../dist && sha256sum "lx-urlaubsplanung-$VERSION.apk" > "lx-urlaubsplanung-$VERSION.apk.sha256"

      - name: Schlüssel wieder entfernen
        if: always()
        run: rm -f android/app/upload.jks android/key.properties

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lx-urlaubsplanung-android
          path: |
            dist/lx-urlaubsplanung-*.apk
            dist/lx-urlaubsplanung-*.apk.sha256
          if-no-files-found: error

  release:
    needs: [windows, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Nicht den eingebauten Publisher von electron-builder 26 nutzen: Er legte zwei Releases an,
      # eines davon ohne Installer, und installierte Apps fanden keine latest.yml.
      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" --draft --title "lx-urlaubsplanung $VERSION" --notes "" \
            "dist/lx-urlaubsplanung-Setup-$VERSION.exe" \
            "dist/lx-urlaubsplanung-Setup-$VERSION.exe.blockmap" \
            "dist/latest.yml" \
            "dist/lx-urlaubsplanung-$VERSION.apk" \
            "dist/lx-urlaubsplanung-$VERSION.apk.sha256"
