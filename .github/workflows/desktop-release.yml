# Baut die Windows-Desktop-App (NSIS-Installer mit automatischen Updates).
# - Tag v* (git tag vX.Y.Z && git push origin main vX.Y.Z): Build, Tests, Paketprüfung und GENAU EIN
#   Release-Entwurf mit Installer, .blockmap und latest.yml. Installierte Apps sehen das Update erst,
#   wenn der Entwurf veröffentlicht ist (gh release edit vX.Y.Z --draft=false --latest --notes-file …).
# - manuell (workflow_dispatch): Probe-Build ohne Veröffentlichung, Installer als Workflow-Artefakt.
#
# Härtung: Der Build läuft nur mit Leserechten und ohne gespeicherte Zugangsdaten; Schreibrechte bekommt
# allein der kleine Release-Job, der keinen Projektcode ausführt.
name: Desktop-Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Nicht windows-latest: Runner mit neuerem Visual Studio erkennt node-gyp älterer electron-builder nicht.
    runs-on: windows-2022
    env:
      # Ohne Zertifikat keine Signatur versuchen
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # Actions per Commit-SHA gepinnt: ein verschobener Tag kann keinen fremden Code einschleusen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Release-Builds ohne Cache (kein Risiko durch einen manipulierten Cache)
          cache: ${{ github.event_name == 'push' && '' || 'npm' }}
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Tag muss zur Version in package.json passen
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu package.json ($VERSION)"
            exit 1
          fi

      # Ohne Lifecycle-Skripte der Abhängigkeiten; better-sqlite3 bringt Node-API-Prebuilds mit.
      - name: Abhängigkeiten installieren
        run: |
          npm ci --ignore-scripts
          npm run desktop:deps
          npx prisma generate

      - name: Typprüfung, Lint und Tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Desktop-App bauen
        run: |
          npm run desktop:prepare
          npx electron-builder --win --publish never

      # Jede Abhängigkeit muss im Paket so auflösbar sein wie später zur Laufzeit.
      - name: Paket prüfen
        run: node scripts/pruefe-paket.cjs

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lx-urlaubsplanung-windows
          path: |
            dist/lx-urlaubsplanung-Setup-*.exe
            dist/lx-urlaubsplanung-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lx-urlaubsplanung-windows
          path: dist

      # Nicht den eingebauten Publisher von electron-builder 26 nutzen: Er legte zwei Releases an,
      # eines davon ohne Installer, und installierte Apps fanden keine latest.yml.
      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" --draft --title "lx-urlaubsplanung $VERSION" --notes "" \
            "dist/lx-urlaubsplanung-Setup-$VERSION.exe" \
            "dist/lx-urlaubsplanung-Setup-$VERSION.exe.blockmap" \
            "dist/latest.yml"
